<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回し車 & 体重 マルチダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; text-align: center; }
        .controls { margin-bottom: 12px; }
        button, input, select { padding: 10px 14px; font-size: 15px; margin: 4px; cursor: pointer; }
        #chartContainer { width: 100%; max-width: 600px; margin: 0 auto; }
        #statsContainer { margin-top: 15px; font-size: 15px; background-color: #f9f9f9; padding: 12px 18px; border-radius: 8px; display: inline-block; text-align: left; }
        .device-box { background: #e3f2fd; padding: 12px; border-radius: 8px; display: inline-block; margin-bottom: 10px; border: 1px solid #90caf9; }
        .weight-box { background: #f1f8e9; padding: 8px 12px; border-radius: 8px; display: inline-block; margin-bottom: 10px; border: 1px solid #c8e6c9; }
        .import-box { background: #fff3e0; padding: 8px 12px; border-radius: 8px; display: inline-block; margin-bottom: 10px; border: 1px solid #ffe0b2; }
        .toggle-box { background: #fafafa; padding: 10px 15px; border-radius: 8px; display: inline-block; margin-bottom: 10px; border: 1px solid #ddd; }
        .toggle-box label { margin: 0 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>回し車 マルチダッシュボード</h2>
    
    <!-- 個体切り替え・接続コントロール -->
    <div class="device-box">
        <label for="deviceSelect"><b>表示する個体:</b> </label>
        <select id="deviceSelect" style="font-weight: bold; color: #0d47a1;">
            <!-- 動的に生成されます -->
        </select><br>
        <button id="connectBtn" style="background-color: #bbdefb; font-weight: bold; margin-top: 6px;">Bluetooth 接続（現在の個体に紐付け）</button><br>
        <button id="renameBtn" style="font-size: 13px; padding: 4px 8px; margin-top: 4px;">選択中の名前にカスタム名を設定</button>
    </div><br>

    <!-- 体重手動入力コントロール -->
    <div class="weight-box">
        <label for="weightInput">今日の体重 (g): </label>
        <input type="number" id="weightInput" step="0.1" placeholder="例: 35.2" style="width: 90px;">
        <button id="saveWeightBtn">体重を保存</button>
    </div>

    <!-- CSVインポートコントロール -->
    <div class="import-box">
        <label for="importCsvFile" style="font-size: 14px; cursor: pointer;">CSVインポート: </label>
        <input type="file" id="importCsvFile" accept=".csv" style="font-size: 14px;">
    </div>

    <!-- グラフの表示・非表示切り替えチェックボックス -->
    <div class="toggle-box">
        <b>表示項目選択: </b>
        <label style="color: rgb(75, 192, 192);"><input type="checkbox" class="metric-toggle" data-index="0" checked> 回転数</label>
        <label style="color: rgb(255, 99, 132);"><input type="checkbox" class="metric-toggle" data-index="1" checked> 平均速度</label>
        <label style="color: rgb(54, 162, 235);"><input type="checkbox" class="metric-toggle" data-index="2" checked> 運動時間</label>
        <label style="color: rgb(156, 39, 176);"><input type="checkbox" class="metric-toggle" data-index="3" checked> 体重</label>
    </div>

    <!-- 棒グラフ対象の選択メニュー -->
    <div class="controls">
        <label for="barTargetSelect">棒グラフの対象: </label>
        <select id="barTargetSelect">
            <option value="2" selected>運動時間 (分)</option>
            <option value="0">回転数 (回)</option>
            <option value="1">平均速度 (cm/s)</option>
            <option value="3">体重 (g)</option>
        </select>
    </div>

    <!-- 日付操作・管理コントロール -->
    <div class="controls">
        <button id="prevDayBtn">◀ 前日</button>
        <input type="date" id="dateFilter">
        <button id="nextDayBtn">翌日 ▶</button>
        <button id="filterBtn">指定日周辺を表示</button>
        <button id="resetBtn">最新に戻る</button>
        <button id="downloadCsvBtn" style="background-color: #e8f5e9; border: 1px solid #4caf50;">CSV保存</button>
        <button id="clearBtn" style="color: red;">データ全消去</button>
    </div>

    <div id="chartContainer">
        <canvas id="wheelChart"></canvas>
    </div>

    <!-- 集計結果表示エリア -->
    <div id="statsContainer">
        <b>【選択個体・日の確定データ】</b><br>
        対象個体: <span id="displayDeviceName" style="color: #d32f2f; font-weight: bold;">--</span><br>
        対象日付: <span id="displayDate" style="color: #1976d2; font-weight: bold;">--</span><br>
        体重: <span id="displayWeight">--</span> g<br>
        総運動時間: <span id="totalDuration">--</span> 分<br>
        平均速度: <span id="avgSpeed">--</span> cm/s<br>
        総回転数: <span id="totalRpm">--</span> 回
    </div>

    <script>
        // --- 複数個体・名前管理システム ---
        function getDeviceNamesMap() {
            return JSON.parse(localStorage.getItem('wheelDeviceNamesMap')) || {};
        }

        function updateDeviceSelectOptions(selectedKey = null) {
            const map = getDeviceNamesMap();
            const deviceSelect = document.getElementById('deviceSelect');
            deviceSelect.innerHTML = '';

            let keys = Object.keys(map);
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k.startsWith('wheelData_')) {
                    const devName = k.replace('wheelData_', '');
                    if (!keys.includes(devName) && !Object.values(map).includes(devName)) {
                        keys.push(devName);
                    }
                }
            }

            if (keys.length === 0) {
                keys = ['GIGI-01'];
            }

            keys.forEach(key => {
                const displayName = map[key] || key;
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = displayName;
                deviceSelect.appendChild(opt);
            });

            if (selectedKey && [...deviceSelect.options].some(o => o.value === selectedKey)) {
                deviceSelect.value = selectedKey;
            }
        }

        function getCurrentDeviceKey() {
            const deviceSelect = document.getElementById('deviceSelect');
            return deviceSelect.value || 'GIGI-01';
        }

        function getStorageKey() {
            return `wheelData_${getCurrentDeviceKey()}`;
        }

        updateDeviceSelectOptions(localStorage.getItem('activeSelectedDevice') || 'GIGI-01');

        // --- スタイル定義 ---
        const metricStyles = [
            { borderColor: 'rgb(75, 192, 192)', bgColor: 'rgba(75, 192, 192, 0.3)' }, 
            { borderColor: 'rgb(255, 99, 132)',  bgColor: 'rgba(255, 99, 132, 0.3)' },  
            { borderColor: 'rgb(54, 162, 235)',  bgColor: 'rgba(54, 162, 235, 0.3)' },  
            { borderColor: 'rgb(156, 39, 176)',  bgColor: 'rgba(156, 39, 176, 0.3)' }   
        ];

        // --- 1. Chart.js の初期設定 ---
        const ctx = document.getElementById('wheelChart').getContext('2d');
        const wheelChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: '回転数 (回)', type: 'line', data: [], borderColor: metricStyles[0].borderColor, backgroundColor: 'transparent', yAxisID: 'y', tension: 0.1, order: 1, hidden: false },
                    { label: '平均速度 (cm/s)', type: 'line', data: [], borderColor: metricStyles[1].borderColor, backgroundColor: 'transparent', yAxisID: 'y2', tension: 0.1, order: 1, hidden: false },
                    { label: '運動時間 (分)', type: 'bar', data: [], borderColor: metricStyles[2].borderColor, backgroundColor: metricStyles[2].bgColor, borderWidth: 1, yAxisID: 'y2', order: 2, hidden: false },
                    { label: '体重 (g)', type: 'line', data: [], borderColor: metricStyles[3].borderColor, backgroundColor: 'transparent', yAxisID: 'y3', tension: 0.1, order: 1, hidden: false }
                ]
            },
            options: {
                scales: {
                    y: { type: 'linear', display: true, position: 'left' },
                    y2: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false } },
                    y3: { type: 'linear', display: false, position: 'right' }
                }
            }
        });

        // --- グラフ項目の表示・非表示を切り替えるイベント ---
        document.querySelectorAll('.metric-toggle').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const index = parseInt(e.target.getAttribute('data-index'));
                const dataset = wheelChart.data.datasets[index];
                dataset.hidden = !e.target.checked;
                wheelChart.update();
            });
        });

        // --- 2. グラフ描画ヘルパー（最新N件） ---
        function renderRecentData(limit = 50) {
            const currentKey = getCurrentDeviceKey();
            localStorage.setItem('activeSelectedDevice', currentKey);
            document.getElementById('displayDeviceName').textContent = currentKey;

            let history = JSON.parse(localStorage.getItem(getStorageKey())) || [];
            history.sort((a, b) => new Date(a.time) - new Date(b.time));

            const recentData = history.slice(-limit);
            updateChartWithData(recentData);

            // 最新データの最後の1件の日付を集計エリアに反映
            if (recentData.length > 0) {
                const latest = recentData[recentData.length - 1];
                document.getElementById('displayDate').textContent = latest.time + " (最新)";
                document.getElementById('displayWeight').textContent = latest.weight !== undefined ? latest.weight : "--";
                document.getElementById('totalDuration').textContent = latest.duration || 0;
                document.getElementById('avgSpeed').textContent = (latest.speed || 0).toFixed(1);
                document.getElementById('totalRpm').textContent = (latest.rpm || 0).toLocaleString();
            } else {
                document.getElementById('displayDate').textContent = "--";
                document.getElementById('displayWeight').textContent = "--";
                document.getElementById('totalDuration').textContent = "--";
                document.getElementById('avgSpeed').textContent = "--";
                document.getElementById('totalRpm').textContent = "--";
            }
        }

        // --- 指定日を起点にした周辺データを描画する関数 ---
        function renderDataAroundDate(targetDateStr, limit = 50) {
            const currentKey = getCurrentDeviceKey();
            localStorage.setItem('activeSelectedDevice', currentKey);
            document.getElementById('displayDeviceName').textContent = currentKey;

            let history = JSON.parse(localStorage.getItem(getStorageKey())) || [];
            history.sort((a, b) => new Date(a.time) - new Date(b.time));

            let targetIndex = history.findIndex(item => item.time === targetDateStr);
            
            let displayData = [];
            if (targetIndex !== -1) {
                let half = Math.floor(limit / 2);
                let start = Math.max(0, targetIndex - half);
                let end = Math.min(history.length, start + limit);
                if (end - start < limit && start > 0) {
                    start = Math.max(0, end - limit);
                }
                displayData = history.slice(start, end);
            } else {
                displayData = history.slice(-limit);
            }

            updateChartWithData(displayData);
        }

        // 共通のチャート更新処理
        function updateChartWithData(dataList) {
            wheelChart.data.labels = [];
            wheelChart.data.datasets[0].data = [];
            wheelChart.data.datasets[1].data = [];
            wheelChart.data.datasets[2].data = [];
            wheelChart.data.datasets[3].data = [];

            dataList.forEach(item => {
                wheelChart.data.labels.push(item.time);
                wheelChart.data.datasets[0].data.push(item.rpm || 0);
                wheelChart.data.datasets[1].data.push(item.speed || 0);
                wheelChart.data.datasets[2].data.push(item.duration || 0);
                wheelChart.data.datasets[3].data.push(item.weight !== undefined ? item.weight : null);
            });
            wheelChart.update();
        }

        renderRecentData(50);

        document.getElementById('deviceSelect').addEventListener('change', () => {
            renderRecentData(50);
            document.getElementById('dateFilter').value = "";
        });

        // --- 3. Bluetooth 接続とデータ受信 ---
        const connectBtn = document.getElementById('connectBtn');
        let receiveBuffer = "";
        let activeConnectedDevice = null;

        connectBtn.addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [0xFFE0] }]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(0xFFE0);
                const characteristic = await service.getCharacteristic(0xFFE1);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                activeConnectedDevice = device.id;
                
                const map = getDeviceNamesMap();
                if (map[activeConnectedDevice]) {
                    updateDeviceSelectOptions(map[activeConnectedDevice]);
                } else {
                    map[activeConnectedDevice] = getCurrentDeviceKey();
                    localStorage.setItem('wheelDeviceNamesMap', JSON.stringify(map));
                }

                connectBtn.textContent = "Bluetooth 接続済み";
                renderRecentData(50);
                alert(`デバイスに接続しました！ データは [${getCurrentDeviceKey()}] に記録されます。`);
            } catch (error) {
                console.error(error);
                alert("接続に失敗しました。");
            }
        });

        document.getElementById('renameBtn').addEventListener('click', () => {
            const currentKey = getCurrentDeviceKey();
            const newName = prompt("現在選択している個体の新しい名前（例: GIGI-02）を入力してください:", currentKey);
            
            if (newName && newName.trim() !== "" && newName.trim() !== currentKey) {
                const trimmedName = newName.trim();
                
                const oldData = localStorage.getItem(`wheelData_${currentKey}`);
                if (oldData) {
                    localStorage.setItem(`wheelData_${trimmedName}`, oldData);
                    localStorage.removeItem(`wheelData_${currentKey}`);
                }

                const map = getDeviceNamesMap();
                if (activeConnectedDevice) {
                    map[activeConnectedDevice] = trimmedName;
                }
                localStorage.setItem('wheelDeviceNamesMap', JSON.stringify(map));

                updateDeviceSelectOptions(trimmedName);
                renderRecentData(50);
                alert(`個体名を [${trimmedName}] に変更しました！`);
            }
        });

        function handleData(event) {
            const text = new TextDecoder().decode(event.target.value);
            receiveBuffer += text;
            let lines = receiveBuffer.split('\n');
            receiveBuffer = lines.pop(); 

            for (let line of lines) {
                line = line.trim();
                if (line.length > 0) processCSV(line);
            }
        }

        // --- 4. データの受信処理 ---
        function processCSV(csvLine) {
            const values = csvLine.split(',');
            if (values.length < 4) return; 

            const dateValue = values[0].trim();
            const rpmValue = parseFloat(values[1]);
            const speedValue = parseFloat(values[2]);
            const timeValue = parseFloat(values[3]);
            
            if (!dateValue || isNaN(rpmValue) || isNaN(speedValue) || isNaN(timeValue)) return; 

            let history = JSON.parse(localStorage.getItem(getStorageKey())) || [];
            const existingIndex = history.findIndex(item => item.time === dateValue);
            
            if (existingIndex !== -1) {
                history[existingIndex].rpm = rpmValue;
                history[existingIndex].speed = speedValue;
                history[existingIndex].duration = timeValue;
            } else {
                history.push({ time: dateValue, rpm: rpmValue, speed: speedValue, duration: timeValue, weight: undefined });
                if (history.length > 10000) history.shift();
            }

            history.sort((a, b) => new Date(a.time) - new Date(b.time));
            localStorage.setItem(getStorageKey(), JSON.stringify(history));
            renderRecentData(50);
        }

        // --- 5. 体重の手動保存処理 ---
        const weightInput = document.getElementById('weightInput');
        document.getElementById('saveWeightBtn').addEventListener('click', () => {
            const weightVal = parseFloat(weightInput.value);
            if (isNaN(weightVal)) {
                alert("有効な体重の数値を入力してください。");
                return;
            }

            let targetDateStr = document.getElementById('dateFilter').value;
            if (!targetDateStr) {
                const today = new Date();
                targetDateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            }

            let history = JSON.parse(localStorage.getItem(getStorageKey())) || [];
            let existingIndex = history.findIndex(item => item.time === targetDateStr);

            if (existingIndex !== -1) {
                history[existingIndex].weight = weightVal;
            } else {
                history.push({ time: targetDateStr, rpm: 0, speed: 0, duration: 0, weight: weightVal });
            }

            history.sort((a, b) => new Date(a.time) - new Date(b.time));
            localStorage.setItem(getStorageKey(), JSON.stringify(history));
            alert(`[${getCurrentDeviceKey()}] ${targetDateStr} の体重 ${weightVal}g を保存しました！`);
            showDateDataAndAround(targetDateStr);
        });

        // --- 6. CSVインポート処理 ---
        document.getElementById('importCsvFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                const lines = text.split(/\r\n|\n/);
                
                let history = JSON.parse(localStorage.getItem(getStorageKey())) || [];
                let importedCount = 0;

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const cols = line.split(',');
                    if (cols.length < 4) continue;

                    const dateVal = cols[0].trim();
                    const rpmVal = parseFloat(cols[1]) || 0;
                    const speedVal = parseFloat(cols[2]) || 0;
                    const timeVal = parseFloat(cols[3]) || 0;
                    const weightVal = cols[4] !== undefined && cols[4] !== "" ? parseFloat(cols[4]) : undefined;

                    if (!dateVal) continue;

                    let existingIndex = history.findIndex(item => item.time === dateVal);
                    if (existingIndex !== -1) {
                        history[existingIndex].rpm = rpmVal;
                        history[existingIndex].speed = speedVal;
                        history[existingIndex].duration = timeVal;
                        if (weightVal !== undefined) history[existingIndex].weight = weightVal;
                    } else {
                        history.push({
                            time: dateVal,
                            rpm: rpmVal,
                            speed: speedVal,
                            duration: timeVal,
                            weight: weightVal
                        });
                    }
                    importedCount++;
                }

                history.sort((a, b) => new Date(a.time) - new Date(b.time));

                localStorage.setItem(getStorageKey(), JSON.stringify(history));
                updateDeviceSelectOptions(getCurrentDeviceKey());
                renderRecentData(50);
                alert(`[${getCurrentDeviceKey()}] に ${importedCount} 件のデータをインポートしました！`);
                e.target.value = "";
            };
            reader.readAsText(file, 'UTF-8');
        });

        // --- 7. 棒グラフ項目の動的切替 ---
        document.getElementById('barTargetSelect').addEventListener('change', (e) => {
            const selectedIndex = parseInt(e.target.value);
            wheelChart.data.datasets.forEach((ds, index) => {
                if (index === selectedIndex) {
                    ds.type = 'bar';
                    ds.backgroundColor = metricStyles[index].bgColor;
                    ds.borderColor = metricStyles[index].borderColor;
                    ds.borderWidth = 1;
                    ds.order = 2;
                } else {
                    ds.type = 'line';
                    ds.backgroundColor = 'transparent';
                    ds.borderColor = metricStyles[index].borderColor;
                    ds.borderWidth = 2;
                    ds.tension = 0.1;
                    ds.order = 1;
                }
            });
            wheelChart.update();
        });

        // --- 8. 指定日周辺のデータ表示 ＆ 前日・翌日ナビゲーション ---
        const dateFilter = document.getElementById('dateFilter');

        function showDateDataAndAround(targetDateStr) {
            const history = JSON.parse(localStorage.getItem(getStorageKey())) || [];
            const targetRecord = history.find(item => item.time === targetDateStr);

            dateFilter.value = targetDateStr;

            if (!targetRecord) {
                document.getElementById('displayDate').textContent = targetDateStr + " (データなし)";
                document.getElementById('displayWeight').textContent = "--";
                document.getElementById('totalDuration').textContent = "--";
                document.getElementById('avgSpeed').textContent = "--";
                document.getElementById('totalRpm').textContent = "--";
            } else {
                document.getElementById('displayDate').textContent = targetRecord.time;
                document.getElementById('displayWeight').textContent = targetRecord.weight !== undefined ? targetRecord.weight : "--";
                document.getElementById('totalDuration').textContent = targetRecord.duration || 0;
                document.getElementById('avgSpeed').textContent = (targetRecord.speed || 0).toFixed(1);
                document.getElementById('totalRpm').textContent = (targetRecord.rpm || 0).toLocaleString();
            }

            renderDataAroundDate(targetDateStr, 50);
        }

        document.getElementById('filterBtn').addEventListener('click', () => {
            if (!dateFilter.value) { alert("日付を選択してください。"); return; }
            showDateDataAndAround(dateFilter.value);
        });

        function shiftDate(days) {
            let baseDateStr = dateFilter.value;
            let baseDate = baseDateStr ? new Date(baseDateStr) : new Date();
            baseDate.setDate(baseDate.getDate() + days);

            const yyyy = baseDate.getFullYear();
            const mm = String(baseDate.getMonth() + 1).padStart(2, '0');
            const dd = String(baseDate.getDate()).padStart(2, '0');
            showDateDataAndAround(`${yyyy}-${mm}-${dd}`);
        }

        document.getElementById('prevDayBtn').addEventListener('click', () => shiftDate(-1));
        document.getElementById('nextDayBtn').addEventListener('click', () => shiftDate(1));

        document.getElementById('resetBtn').addEventListener('click', () => {
            renderRecentData(50);
            dateFilter.value = "";
        });

        // --- 9. CSV一括ダウンロード ---
        document.getElementById('downloadCsvBtn').addEventListener('click', () => {
            let history = JSON.parse(localStorage.getItem(getStorageKey())) || [];
            if (history.length === 0) { alert("保存するデータがありません。"); return; }

            history.sort((a, b) => new Date(a.time) - new Date(b.time));

            let csvContent = "日付,回転数(回),平均速度(cm/s),運動時間(分),体重(g)\r\n";
            history.forEach(item => {
                const w = item.weight !== undefined ? item.weight : "";
                csvContent += `${item.time},${item.rpm || 0},${item.speed || 0},${item.duration || 0},${w}\r\n`;
            });

            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
            const today = new Date().toISOString().split('T')[0];
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${getCurrentDeviceName()}_wheel_data_${today}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        });

        // --- 10. データ全消去 ---
        document.getElementById('clearBtn').addEventListener('click', () => {
            const currentName = getCurrentDeviceKey();
            if (confirm(`本当に個体 [${currentName}] のすべてのデータを消去しますか？`)) {
                localStorage.removeItem(getStorageKey());
                renderRecentData(50);
                dateFilter.value = "";
                alert(`個体 [${currentName}] のデータを消去しました。`);
            }
        });
    </script>
</body>
</html>
