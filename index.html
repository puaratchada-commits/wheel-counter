<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回し車 & 体重 マルチダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; text-align: center; background-color: #fdfdfd; color: #333; }
        .controls { margin-bottom: 12px; }
        button, input, select { padding: 10px 14px; font-size: 15px; margin: 4px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; }
        button { background-color: #fff; transition: background 0.2s; }
        button:hover { background-color: #f0f0f0; }
        .chart-box { width: 100%; max-width: 650px; margin: 15px auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        #statsContainer { margin-top: 15px; font-size: 15px; background-color: #f9f9f9; padding: 12px 18px; border-radius: 8px; display: inline-block; text-align: left; border: 1px solid #e0e0e0; line-height: 1.8; }
        .device-box { background: #e3f2fd; padding: 12px; border-radius: 8px; display: inline-block; margin-bottom: 10px; border: 1px solid #90caf9; }
        .weight-box { background: #f1f8e9; padding: 8px 12px; border-radius: 8px; display: inline-block; margin-bottom: 10px; border: 1px solid #c8e6c9; }
        .import-box { background: #fff3e0; padding: 8px 12px; border-radius: 8px; display: inline-block; margin-bottom: 10px; border: 1px solid #ffe0b2; }
        h3 { margin: 10px 0 5px 0; color: #1976d2; }
    </style>
</head>
<body>

    <h2>回し車 マルチダッシュボード</h2>
    
    <!-- 個体切り替え・接続コントロール -->
    <div class="device-box">
        <label for="deviceSelect"><b>表示する個体:</b> </label>
        <select id="deviceSelect" style="font-weight: bold; color: #0d47a1;">
            <!-- 動的に生成されます -->
        </select><br>
        <button id="connectBtn" style="background-color: #bbdefb; font-weight: bold; margin-top: 6px;">Bluetooth 接続（名前で自動識別）</button><br>
        <button id="renameBtn" style="font-size: 13px; padding: 4px 8px; margin-top: 4px;">選択中の名前にカスタム名を設定</button>
    </div><br>

    <!-- 体重手動入力コントロール -->
    <div class="weight-box">
        <label for="weightInput">今日の体重 (g): </label>
        <input type="number" id="weightInput" step="0.1" placeholder="例: 35.2" style="width: 90px;">
        <button id="saveWeightBtn">体重を保存</button>
    </div>

    <!-- CSVインポートコントロール -->
    <div class="import-box">
        <label for="importCsvFile" style="font-size: 14px; cursor: pointer;">CSVインポート: </label>
        <input type="file" id="importCsvFile" accept=".csv" style="font-size: 14px;">
    </div>

    <!-- 棒グラフ対象の選択メニュー -->
    <div class="controls">
        <label for="barTargetSelect">全体棒グラフの対象: </label>
        <select id="barTargetSelect">
            <option value="2" selected>運動時間 (分)</option>
            <option value="0">回転数 (回)</option>
            <option value="1">平均速度 (cm/s)</option>
            <option value="3">体重 (g)</option>
        </select>
    </div>

    <!-- 日付操作・管理コントロール -->
    <div class="controls">
        <button id="prevDayBtn">◀ 前日</button>
        <input type="date" id="dateFilter">
        <button id="nextDayBtn">翌日 ▶</button>
        <button id="filterBtn">指定日周辺を表示</button>
        <button id="resetBtn">最新に戻る</button>
        <button id="downloadCsvBtn" style="background-color: #e8f5e9; border: 1px solid #4caf50;">CSV保存</button>
        <button id="clearBtn" style="color: red;">データ全消去</button>
    </div>

    <!-- 全体推移グラフ -->
    <div class="chart-box">
        <h3>【日付ごとの推移】</h3>
        <canvas id="wheelChart"></canvas>
    </div>

    <!-- 12時〜翌11時 時間帯別分布グラフ -->
    <div class="chart-box">
        <h3 id="hourlyTitle">【24時間分布 (12:00 〜 翌11:00)】</h3>
        <canvas id="hourlyChart"></canvas>
    </div>

    <!-- 集計結果表示エリア -->
    <div id="statsContainer">
        <b>【選択個体・日の確定データ】</b><br>
        対象個体: <span id="displayDeviceName" style="color: #d32f2f; font-weight: bold;">--</span><br>
        対象日付: <span id="displayDate" style="color: #1976d2; font-weight: bold;">--</span><br>
        体重: <span id="displayWeight">--</span> g<br>
        運動時間帯: <span id="displayTimeRange" style="font-weight: bold; color: #2e7d32;">--:-- ～ --:--</span><br>
        総運動時間: <span id="totalDuration">--</span> 分<br>
        平均速度: <span id="avgSpeed">--</span> cm/s<br>
        総回転数: <span id="totalRpm">-- 回</span>
    </div>
